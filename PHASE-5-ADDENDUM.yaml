# ─────────────────────────────────────────────────────────────────────────────
# PHASE 5 ADDENDUM — append this phase block into the existing `phases:` list
# in .loom/plan.yaml. Do not replace phases 1-4; this slots in after phase-4.
#
# Context: plan.yaml reported 34/34 tasks complete and zero pending work.
# That reflects the original BUILDING.md phase checklist, which was scoped
# before several design decisions were finalized (Ink TUI, Foundry API spec,
# embedding generation, production packaging). This phase captures what was
# specified but never tracked as a task, plus verification of claims made in
# narrative.md that have not been independently confirmed.
#
# Every task below exists because something in the narrative or repo state
# is either missing, unconfirmed, or built on an unverified foundation.
# Do not mark any task complete without the stated verification passing.
# ─────────────────────────────────────────────────────────────────────────────

- id:        phase-5
  name:      "Verification, Design System, and Production Readiness"
  status:    active
  depends_on: [phase-4]
  exit_criterion: >
    A single compiled `loom` binary exists, opens an Ink-rendered TUI
    matching the loom-dark theme, performs real semantic recall end-to-end
    from a natural-language query, has a verified Foundry client against a
    confirmed API spec, and has zero uncommitted or unverified work.

  milestones:

    # ── M5-1 — Repository and claim audit (do this FIRST) ─────────────────
    - id:     m5-1
      name:   "Repository and claim audit"
      status: planned
      agent:  architect
      exit_criterion: >
        Every claim in narrative.md about "implemented and verified" work
        is confirmed against actual committed, tested code — not just
        narrative text.
      tasks:
        - id:             t5-1-1
          name:           "Run git status; commit or explicitly document any uncommitted work"
          status:         planned
          token_estimate: small

        - id:             t5-1-2
          name:           "Confirm whether foundry-api.md existed in the working tree when src/foundry/ was built"
          status:         planned
          token_estimate: small
          notes: >
            If foundry-api.md was absent when the Foundry client was written,
            treat every endpoint shape, auth header, and error envelope in
            src/foundry/ as unverified against spec. Do not assume it is
            correct because tests pass — tests may have been written against
            the same unverified assumptions.

        - id:             t5-1-3
          name:           "Reconcile SPEC.md section 7 against the current repo tree one more time"
          status:         planned
          token_estimate: small
          depends_on:     [t5-1-1]

        - id:             t5-1-4
          name:           "Audit which plan.yaml tasks 1-34 map to which real deliverable; flag any task whose name is broader than what was actually built"
          status:         planned
          token_estimate: medium
          notes: >
            Specifically check the agent tab switching task — narrative
            2026-07-08 states it was built as a "session-level text tab
            strip" instead of an Ink component due to missing dependencies.
            Confirm this was tracked as a deliberate scope reduction, not
            treated as equivalent to the original Ink TUI requirement.

    # ── M5-2 — Missing reference specs ─────────────────────────────────────
    - id:     m5-2
      name:   "Add missing reference specs to repository"
      status: planned
      agent:  architect
      depends_on: [m5-1]
      tasks:
        - id:             t5-2-1
          name:           "Add foundry-api.md to repository root"
          status:         planned
          token_estimate: small
          notes: "Request from operator if not available locally."

        - id:             t5-2-2
          name:           "Add foundry-server.toml to repository root"
          status:         planned
          token_estimate: small

        - id:             t5-2-3
          name:           "Add loom-config.toml to repository root"
          status:         planned
          token_estimate: small

        - id:             t5-2-4
          name:           "Add loom-tests.yaml to repository root"
          status:         planned
          token_estimate: small

        - id:             t5-2-5
          name:           "Re-verify src/foundry/ client against foundry-api.md once present; fix any drift"
          status:         planned
          token_estimate: medium
          depends_on:     [t5-2-1]

    # ── M5-3 — Ink TUI and design system integration ───────────────────────
    - id:     m5-3
      name:   "Ink TUI and design system integration"
      status: planned
      agent:  developer
      depends_on: [m5-1]
      tasks:
        - id:             t5-3-1
          name:           "Add ink, react, and their type dependencies to package.json"
          status:         planned
          token_estimate: small

        - id:             t5-3-2
          name:           "Move src_tui_theme.ts to src/tui/theme.ts as the live module (not just a flattened reference)"
          status:         planned
          token_estimate: small

        - id:             t5-3-3
          name:           "Move src_tui_components.tsx to src/tui/components.tsx as the live module"
          status:         planned
          token_estimate: small
          depends_on:     [t5-3-1, t5-3-2]

        - id:             t5-3-4
          name:           "Move src_cli_commands_theme.ts to src/cli/commands/theme.ts; register loom theme list/use/preview"
          status:         planned
          token_estimate: small
          depends_on:     [t5-3-2]

        - id:             t5-3-5
          name:           "Rebuild src/tui/session.ts as an Ink component tree, replacing the text tab strip with AgentTabStrip"
          status:         planned
          token_estimate: large
          depends_on:     [t5-3-3]
          notes: >
            This replaces the interim text-based tab switching from
            2026-07-08 with the originally specified Ink UI. Preserve all
            existing behavior (conversation history across tabs, tool-call
            result display, deterministic test input mode) — this is a
            rendering-layer change, not a behavior change.

        - id:             t5-3-6
          name:           "Wire StatusBar (token progress bar, session id, active agent) into the live session loop"
          status:         planned
          token_estimate: medium
          depends_on:     [t5-3-5]

        - id:             t5-3-7
          name:           "Add defaults.theme field to config schema (default: loom-dark) per prior spec note"
          status:         planned
          token_estimate: small
          depends_on:     [t5-3-4]

        - id:             t5-3-8
          name:           "TSX typecheck coverage in tsconfig.json and Biome config"
          status:         planned
          token_estimate: small
          depends_on:     [t5-3-1]

    # ── M5-4 — Embedding generation for real semantic recall ──────────────
    - id:     m5-4
      name:   "Embedding generation"
      status: planned
      agent:  developer
      depends_on: [m5-1]
      tasks:
        - id:             t5-4-1
          name:           "Implement POST /v1/embeddings client against the configured embedding backend"
          status:         planned
          token_estimate: medium
          notes: >
            Backend and model come from store.embeddingBackend /
            store.embeddingModel in config, resolved via the same
            resolveModel() seam used everywhere else. Do not hardcode a
            model name.

        - id:             t5-4-2
          name:           "Wire embedding generation into Prompt Store writes so every session turn is embedded automatically"
          status:         planned
          token_estimate: medium
          depends_on:     [t5-4-1]

        - id:             t5-4-3
          name:           "Update loom recall to accept a natural-language --query in addition to the existing --vector"
          status:         planned
          token_estimate: medium
          depends_on:     [t5-4-1]
          notes: >
            Keep --vector as a supported explicit-vector path — do not
            remove it. Add --query as the primary user-facing path that
            embeds text through the same client from t5-4-1.

        - id:             t5-4-4
          name:           "Wire inject pipeline stage to call recall automatically using assembled Context Bus state as the query"
          status:         planned
          token_estimate: medium
          depends_on:     [t5-4-3]

    # ── M5-5 — Session Continuity live verification ────────────────────────
    - id:     m5-5
      name:   "Confirm automatic handoff triggering in the live session loop"
      status: planned
      agent:  tester
      depends_on: [m5-1]
      tasks:
        - id:             t5-5-1
          name:           "Write an integration test that runs a real session loop past the 80% token threshold and asserts .loom/handoff.md is written automatically"
          status:         planned
          token_estimate: medium
          notes: >
            Session Manager and handoff.ts were built and unit-tested
            independently per narrative 2026-07-08. Confirm they are
            actually wired together inside src/tui/session.ts, not just
            individually correct in isolation.

        - id:             t5-5-2
          name:           "Confirm new-session handoff ingestion actually injects into the first agent turn's context, not just that the file is read"
          status:         planned
          token_estimate: small
          depends_on:     [t5-5-1]

    # ── M5-6 — Production packaging ─────────────────────────────────────────
    - id:     m5-6
      name:   "Production binary packaging"
      status: planned
      agent:  developer
      depends_on: [m5-3, m5-4, m5-5]
      tasks:
        - id:             t5-6-1
          name:           "Run bun build --compile and produce a working dist/loom binary"
          status:         planned
          token_estimate: small

        - id:             t5-6-2
          name:           "Smoke test the compiled binary standalone (not via bun run) against a real configured backend"
          status:         planned
          token_estimate: small
          depends_on:     [t5-6-1]

        - id:             t5-6-3
          name:           "Add build:linux and build:mac targets verification"
          status:         planned
          token_estimate: small
          depends_on:     [t5-6-1]

        - id:             t5-6-4
          name:           "Full regression pass: bun run typecheck, bun run lint, bun test, plus one live end-to-end session covering agent switching, a pipeline run, a plan command, and a handoff"
          status:         planned
          token_estimate: large
          depends_on:     [t5-6-2]
