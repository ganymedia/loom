# ─────────────────────────────────────────────────────────────────────────────
# LOOM Prompt Intelligence Layer — Configuration Schema
#
# Three levels of configuration, each overriding the one above:
#   1. Global defaults  → ~/.loom/config.yaml under promptIntelligence
#   2. Per-agent        → loom-agent.yaml under prompt_intelligence:
#   3. Per-stage        → .loom pipeline file under stages[*].prompt_intelligence:
#
# The PI layer is transparent to agents and stages. They send a prompt and
# receive a response. All compression, retry, and validation logic runs
# between those two calls without any changes to the calling code.
# ─────────────────────────────────────────────────────────────────────────────


# ═══════════════════════════════════════════════════════════════════════════════
# LEVEL 1 — Global defaults (~/.loom/config.yaml)
# ═══════════════════════════════════════════════════════════════════════════════

[prompt_intelligence]
enabled = true

# ── Retry configuration ───────────────────────────────────────────────────────
max_retries         = 3          # attempts before returning error to calling stage
retry_temperature   = 0.0        # force deterministic on retry
retry_model_fallback = true      # try next model in agent preferred list on exhaustion

# ── Context assembly order ────────────────────────────────────────────────────
# The priority order in which context blocks are assembled before budget check.
# This order is fixed by the runtime; this block documents it for reference.
# [context_assembly_order]
# 1. system_prompt      — agent persona, instructions, capabilities
# 2. plan_state         — current phase, milestone, task, branch (compact)
# 3. recall_injection   — top-k semantic matches from Prompt Store
# 4. session_history    — conversation turns, oldest first
# 5. current_message    — user prompt or stage input (always last)

# ── Budget management ─────────────────────────────────────────────────────────
[prompt_intelligence.budget]
compression_threshold = 0.75    # compress when context exceeds 75% of model window
response_headroom     = 0.25    # reserve 25% of window for the model's response

# Compression priority (highest number = compressed/dropped first)
# P5 → old session turns (summarize)
# P4 → recall injection (trim top-k)
# P3 → plan state (compress to one-liner)
# P2 → recent session turns (last 4 — never compressed)
# P1 → system prompt + current message (never touched)
old_turns_threshold   = 8       # turns older than N are eligible for P5 compression
recall_trim_min       = 1       # never reduce recall below 1 match

[prompt_intelligence.budget.compression]
strategy              = "summarize"   # summarize | drop | hybrid
# summarize: replace old turns with a model-generated summary
# drop:      remove old turns entirely (faster, some information loss)
# hybrid:    summarize turns P5, drop turns > 2× old_turns_threshold

summary_backend       = "vllm-26b"   # backend key from backends.* in config.yaml
summary_model         = "gemma-4-26b"
max_summary_tokens    = 400          # target length for a compressed turn block
summary_prompt        = """Summarize the following conversation turns into a compact
paragraph preserving: decisions made, code written, errors encountered, and key
context for continuing the work. Omit pleasantries and acknowledgements."""

# ── Prompt optimization ───────────────────────────────────────────────────────
[prompt_intelligence.optimization]
strip_whitespace        = true   # normalize whitespace before sending
deduplicate_instructions = true  # remove instructions duplicated in system + user
reorder_for_recency     = true   # move most recent turns closer to the end of context

# Output enforcement (injected when output_schema is set)
json_enforcement_instruction = """Respond ONLY with valid JSON matching the schema
below. No preamble, no explanation, no markdown fences. Your entire response must
be a single parseable JSON object."""

# ── Output validation ─────────────────────────────────────────────────────────
[prompt_intelligence.validation]
enabled                    = true
schema_validation_strict   = true    # fail on any schema violation, not just missing fields
retry_prompt_template      = """Your previous response was invalid. Error: {error}

Return ONLY a valid {format} object. No other text."""

# ── Token tracking ────────────────────────────────────────────────────────────
[prompt_intelligence.tracking]
log_per_stage              = true   # record token usage per stage in session log
warn_at                    = 0.80   # log warning when assembled context hits 80%
error_at                   = 0.95   # log error (but still attempt) at 95%


# ═══════════════════════════════════════════════════════════════════════════════
# LEVEL 2 — Per-agent override (loom-agent.yaml)
# Merges with global config; only keys specified here are overridden.
# ═══════════════════════════════════════════════════════════════════════════════

# Example: Developer agent (conversational, free-form output, longer history)
# prompt_intelligence:
#   budget:
#     old_turns_threshold: 16      # keep more history than default
#     compression_threshold: 0.80  # start compressing later (agent needs more context)
#   validation:
#     enabled: false               # free-form output, no schema to validate
#   tracking:
#     log_per_stage: true

# Example: Security agent (higher retry tolerance, strict validation for findings)
# prompt_intelligence:
#   max_retries: 5                 # security findings must be valid JSON
#   budget:
#     old_turns_threshold: 6       # compress earlier (security scans are dense)
#   optimization:
#     json_enforcement_instruction: >
#       Respond ONLY with a valid JSON array of findings matching the schema.
#       Each finding must include rule_id, severity, file, line, and message.
#       No preamble, no explanation.

# Example: Architect agent (structured planning output required)
# prompt_intelligence:
#   max_retries: 3
#   budget:
#     compression_threshold: 0.70  # compress early — plans can be very long
#     summary_backend: "vllm-26b"
#   validation:
#     enabled: true
#     schema_validation_strict: true


# ═══════════════════════════════════════════════════════════════════════════════
# LEVEL 3 — Per-stage override (.loom pipeline file)
# Merges with agent config; most granular override level.
# ═══════════════════════════════════════════════════════════════════════════════

# Example: Pipeline stage that must return structured JSON
# stages:
#   - id: extract_fields
#     type: prompt
#     backend: vllm-26b
#     prompt: |
#       Extract the following fields from the code review: {{ stages.analyze.output }}
#     output_schema: ./schemas/review_fields.json   # triggers schema validation
#     prompt_intelligence:
#       max_retries: 5                               # extra retries for structured output
#       retry_temperature: 0.0
#       optimization:
#         json_enforcement_instruction: >
#           Return ONLY a valid JSON object with keys: severity, findings, suggestion.

# Example: Fast summary stage (no retry needed, compress aggressively)
# stages:
#   - id: summarize
#     type: prompt
#     prompt_intelligence:
#       max_retries: 0             # fail fast on summary stages
#       budget:
#         compression_threshold: 0.60   # very aggressive compression
#         recall_trim_min: 0            # drop recall entirely if needed

# Example: Sub-agent stage (always validates typed interface)
# Sub-agents have output_schema defined in their loom-agent.yaml interface block.
# The PI layer auto-enables validation for sub-agent stages.
# stages:
#   - id: run_sast
#     type: inject                 # invokes sast-scanner sub-agent
#     ref: "@loom-community/sast-scanner@^1.0"
#     input:
#       files: ["{{ context.modified_files }}"]
#     prompt_intelligence:
#       max_retries: 3


# ═══════════════════════════════════════════════════════════════════════════════
# CONTEXT ASSEMBLY TIER SIZES (reference)
# The PI layer allocates token budgets to each context tier before assembly.
# If total exceeds threshold, compression fires on lowest-priority tiers first.
# ═══════════════════════════════════════════════════════════════════════════════

# [context_tiers]
# Priority 1 (NEVER compressed):
#   system_prompt:    ~1,000–4,000 tokens depending on agent
#   current_message:  ~200–2,000 tokens (the actual user prompt or stage input)
#
# Priority 2 (compressed only as last resort):
#   recent_turns:     last 4 turns, ~2,000–6,000 tokens
#
# Priority 3 (compress to one-liner when under pressure):
#   plan_state:       ~300–800 tokens (phase, milestone, task, branch)
#
# Priority 4 (trim top-k first):
#   recall_injection: ~500–3,000 tokens (3 matches × ~500–1,000 tokens each)
#
# Priority 5 (first to be summarized or dropped):
#   old_turns:        turns older than old_turns_threshold
#                     may be 0–30,000+ tokens in a long session


# ═══════════════════════════════════════════════════════════════════════════════
# RETRY PROMPT CONSTRUCTION (reference)
# ═══════════════════════════════════════════════════════════════════════════════

# On validation failure, the PI layer builds a retry prompt:
#
# Retry 1 (same model, temp=0.0):
#   User: [original prompt]
#   Assistant: [invalid response — included for context]
#   User: "Your previous response was invalid.
#          Error: {specific_validation_error}
#          Return ONLY a valid JSON object. No other text."
#
# Retry 2 (same model, temp=0.0, simpler prompt):
#   User: [original prompt — stripped to essentials]
#   User: "Return ONLY: {schema_summary}"
#
# Retry 3+ (fallback model if retry_model_fallback=true):
#   Switch to next model in agent preferred list.
#   Use simplest possible prompt.
#
# On exhaustion: return PromptIntelligenceError to calling stage.
# The stage can then: log, surface to user, use a default value, or abort pipeline.
