# ─────────────────────────────────────────────────────────────────────────────
# PHASE 8 ADDENDUM — append this phase block into the existing `phases:` list
# in .loom/plan.yaml, after phase-7.
#
# Context: v0.1.0 shipped and is live with a documented, honest limitation —
# a readline REPL rendering static Ink fragments, not a full-screen live
# application. Phase 8 closes that gap and bundles a set of look-and-feel
# improvements identified in the same review, all targeting a 0.1.1 release.
# This is a UX/interaction-model release, not a capability release — no new
# backend functionality is in scope here.
#
# Versioning: this phase produces v0.1.1. It changes the core interaction
# model (readline loop -> persistent Ink render tree), so it is not a silent
# patch — CHANGELOG.md and release notes must say so plainly.
# ─────────────────────────────────────────────────────────────────────────────

- id:        phase-8
  name:      "Full-screen Ink TUI and look-and-feel polish (0.1.1)"
  status:    planned
  depends_on: [phase-7]
  exit_criterion: >
    LOOM runs as a persistent, live-redrawing full-screen terminal
    application matching the interaction feel of comparable tools
    (instant keybindings, streaming output, pinned input, no reprinted
    frames), with the polish items below implemented, verified in a real
    terminal by the operator, and released as v0.1.1.

  milestones:

    # ── M8-1 — Full-screen Ink rebuild (the core architectural change) ─────
    - id:     m8-1
      name:   "Rebuild session.ts as a persistent Ink render tree"
      status: planned
      agent:  developer
      exit_criterion: >
        A single Ink render() call owns the terminal for the session's
        lifetime. No command reprints the tab strip/status bar as a new
        block; the existing frame updates in place.
      tasks:
        - id:             t8-1-1
          name:           "Replace the readline loop in src/tui/session.ts with a top-level Ink render() app"
          status:         planned
          token_estimate: large
          notes: >
            This is the architectural core of Phase 8. Preserve all
            existing agent-switching, tool-call, and conversation-state
            logic — this is a rendering-layer rewrite, not a behavior
            change. AgentContext, SessionManager, and handoff triggers
            must work identically to today.

        - id:             t8-1-2
          name:           "Add useInput-based keybindings: Tab to cycle agents instantly, no Enter required"
          status:         planned
          token_estimate: medium
          depends_on:     [t8-1-1]

        - id:             t8-1-3
          name:           "Stream assistant responses into component state token-by-token instead of printing a completed block"
          status:         planned
          token_estimate: medium
          depends_on:     [t8-1-1]

        - id:             t8-1-4
          name:           "Use <Static> for completed scrollback and a live region for the in-progress turn plus pinned input bar"
          status:         planned
          token_estimate: medium
          depends_on:     [t8-1-1]

        - id:             t8-1-5
          name:           "Handle terminal resize, Ctrl+C/Esc exit, and non-TTY fallback (piped input, CI, --prompt one-shot mode)"
          status:         planned
          token_estimate: medium
          depends_on:     [t8-1-1]
          notes: >
            The current readline implementation handles non-TTY input
            correctly by default. Do not regress this — --prompt and any
            piped/scripted usage must continue to work without requiring
            a real terminal.

    # ── M8-2 — Slash command popup list (operator priority) ────────────────
    - id:     m8-2
      name:   "Slash command popup list, replacing tab-only discovery"
      status: planned
      agent:  developer
      depends_on: [m8-1]
      exit_criterion: >
        Typing "/" as the first character of input shows a live-filtered,
        navigable list of matching commands and agent names below or above
        the input line. The user never needs to already know or Tab
        through exact command syntax to discover it.
      tasks:
        - id:             t8-2-1
          name:           "Show a popup list of available slash commands as soon as \"/\" is typed"
          status:         planned
          token_estimate: medium
          notes: >
            List includes /agent <name> (one entry per built-in and
            installed agent), /tab, /agents, /exit, /quit, and any future
            slash commands. Popup renders inline in the Ink tree, not a
            separate terminal region.

        - id:             t8-2-2
          name:           "Filter the list live as more characters are typed after \"/\""
          status:         planned
          token_estimate: small
          depends_on:     [t8-2-1]

        - id:             t8-2-3
          name:           "Navigate the popup with Up/Down arrow keys; select with Enter or a mouse click if the terminal supports it"
          status:         planned
          token_estimate: medium
          depends_on:     [t8-2-1]
          notes: >
            Tab may still work as an alternate accept, but Enter/click is
            primary — this fixes the operator-identified gap where
            discovery relied on cycling through Tab with no visible list.

        - id:             t8-2-4
          name:           "Esc closes the popup without submitting or clearing the typed input"
          status:         planned
          token_estimate: small
          depends_on:     [t8-2-1]

    # ── M8-3 — Live feedback states ─────────────────────────────────────────
    - id:     m8-3
      name:   "Distinguish thinking, tool-running, and idle states"
      status: planned
      agent:  developer
      depends_on: [m8-1]
      tasks:
        - id:             t8-3-1
          name:           "Add a thinking indicator (spinner/animated dots) immediately on prompt submit, before first streamed token"
          status:         planned
          token_estimate: small

        - id:             t8-3-2
          name:           "Add a visually distinct tool-running indicator, separate from the thinking indicator"
          status:         planned
          token_estimate: medium
          depends_on:     [t8-3-1]

    # ── M8-4 — Reading density and hierarchy ────────────────────────────────
    - id:     m8-4
      name:   "Scrollback hierarchy, markdown rendering, and file-write diffs"
      status: planned
      agent:  developer
      depends_on: [m8-1]
      tasks:
        - id:             t8-4-1
          name:           "Dim or visually recede completed turns so the current exchange is the clear focus"
          status:         planned
          token_estimate: small

        - id:             t8-4-2
          name:           "Render markdown properly: real syntax-highlighted code blocks, styled bold/headers"
          status:         planned
          token_estimate: large
          notes: "Evaluate an existing terminal-markdown Ink-compatible library before hand-rolling one."

        - id:             t8-4-3
          name:           "Show file writes as a diff (+/- lines, red/green) instead of \"File write: ok\""
          status:         planned
          token_estimate: large
          notes: >
            Highest-impact trust signal identified in review. Requires
            the file-writer tool to capture before/after content, not
            just a success boolean.

    # ── M8-5 — Input experience ──────────────────────────────────────────────
    - id:     m8-5
      name:   "Multi-line input and command history"
      status: planned
      agent:  developer
      depends_on: [m8-1]
      tasks:
        - id:             t8-5-1
          name:           "Support multi-line input (Shift+Enter or equivalent) with a visible hint for submit vs newline"
          status:         planned
          token_estimate: medium

        - id:             t8-5-2
          name:           "Add command history (Up-arrow recalls prior prompts), reimplementing what readline gave for free"
          status:         planned
          token_estimate: medium

    # ── M8-6 — Making the differentiators visible ───────────────────────────
    - id:     m8-6
      name:   "Surface Session Continuity, recall, and sub-agent activity"
      status: planned
      agent:  developer
      depends_on: [m8-1]
      tasks:
        - id:             t8-6-1
          name:           "Add a status-line notice when a handoff triggers, instead of silently writing to disk"
          status:         planned
          token_estimate: small

        - id:             t8-6-2
          name:           "Add a visual indicator when inject/recall pulls in prior-session context"
          status:         planned
          token_estimate: medium

        - id:             t8-6-3
          name:           "Surface sub-agent activity as a small live tray, matching the original design spec, currently invisible in the shipped product"
          status:         planned
          token_estimate: medium

    # ── M8-7 — Small polish ───────────────────────────────────────────────────
    - id:     m8-7
      name:   "Cursor, color-coded results, end-of-turn summaries"
      status: planned
      agent:  developer
      depends_on: [m8-1]
      tasks:
        - id:             t8-7-1
          name:           "Real blinking cursor in the input line"
          status:         planned
          token_estimate: small

        - id:             t8-7-2
          name:           "Color-code tool results (green success, amber/red failure) instead of plain text"
          status:         planned
          token_estimate: small

        - id:             t8-7-3
          name:           "Visually set apart the end-of-turn \"what changed\" summary the Developer agent already produces"
          status:         planned
          token_estimate: small

    # ── M8-8 — Verification and 0.1.1 release (do this LAST) ───────────────
    - id:     m8-8
      name:   "Real-terminal verification and 0.1.1 release"
      status: planned
      agent:  tester
      depends_on: [m8-1, m8-2, m8-3, m8-4, m8-5, m8-6, m8-7]
      exit_criterion: >
        The operator has personally used the full-screen TUI in a real
        terminal, confirmed every item above, and v0.1.1 is published
        following RELEASE.md exactly as v0.1.0 was.
      tasks:
        - id:             t8-8-1
          name:           "Full regression: bun run typecheck, bun run lint, bun test, plus a real end-to-end session covering every m8-1..m8-7 item"
          status:         planned
          token_estimate: large

        - id:             t8-8-2
          name:           "Update CHANGELOG.md: v0.1.1 changes the core interaction model, not a silent patch"
          status:         planned
          token_estimate: small
          depends_on:     [t8-8-1]

        - id:             t8-8-3
          name:           "Bump package.json version to 0.1.1"
          status:         planned
          token_estimate: small
          depends_on:     [t8-8-1]

        - id:             t8-8-4
          name:           "Follow RELEASE.md steps 1-8 for v0.1.1, including the unauthenticated live-install verification from outside the repository"
          status:         planned
          token_estimate: medium
          depends_on:     [t8-8-2, t8-8-3]

        - id:             t8-8-5
          name:           "Operator dry run of the full-screen TUI from the published v0.1.1 binary, not local build artifacts"
          status:         planned
          token_estimate: medium
          depends_on:     [t8-8-4]
