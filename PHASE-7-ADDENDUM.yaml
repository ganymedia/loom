# ─────────────────────────────────────────────────────────────────────────────
# PHASE 7 ADDENDUM — append this phase block into the existing `phases:` list
# in .loom/plan.yaml, after phase-6.
#
# Context: Phase 6 (including the m6-6 remediation milestone) closes the gap
# between "the product works" and "a stranger can install and use it."
# Phase 7 closes the gap between that and "this is a real, versioned,
# publicly released product a stranger can trust and find support for."
#
# Do not start Phase 7 until Phase 6 — including m6-6 — is fully complete
# and t6-5-2's real dry run has passed clean.
# ─────────────────────────────────────────────────────────────────────────────

- id:        phase-7
  name:      "Production release readiness"
  status:    planned
  depends_on: [phase-6]
  exit_criterion: >
    LOOM v1 is tagged, published as a GitHub Release with working install
    instructions verified by a stranger, has a changelog and license, and
    has a defined process for receiving and triaging real user feedback.

  milestones:

    # ── M7-1 — Versioning and documentation finalization ───────────────────
    - id:     m7-1
      name:   "Versioning policy, changelog, and license"
      status: planned
      agent:  architect
      exit_criterion: >
        A person reading the repository root understands what version
        this is, what changed since the last version, what they're
        allowed to do with the code, and how to get help.
      tasks:
        - id:             t7-1-1
          name:           "Decide and document the versioning policy (SemVer) and what 1.0.0 means for this project"
          status:         planned
          token_estimate: small
          notes: >
            Confirm with operator whether the first public release is
            v0.1.0 (current package.json version, signaling "early but
            usable") or v1.0.0 (signaling production-stable). Document
            the decision and criteria for future version bumps.

        - id:             t7-1-2
          name:           "Write CHANGELOG.md summarizing Phases 1-7 in user-facing terms"
          status:         planned
          token_estimate: medium
          notes: >
            Not a copy of narrative.md — narrative.md is internal decision
            history. CHANGELOG.md is what a user reads to know what LOOM
            can do and what changed. Written in terms of capability, not
            implementation.

        - id:             t7-1-3
          name:           "Add a LICENSE file"
          status:         planned
          token_estimate: small
          notes: "Confirm license choice with operator before adding — not assumed."

        - id:             t7-1-4
          name:           "Final README pass: confirm every documented command and config example matches the actual released binary"
          status:         planned
          token_estimate: medium
          depends_on:     [t7-1-1]

    # ── M7-2 — Security and safety pass ─────────────────────────────────────
    - id:     m7-2
      name:   "Pre-release security and safety review"
      status: planned
      agent:  security
      exit_criterion: >
        The tool and attack surface, expanded meaningfully since Phase 1
        by the installer and first-run wizard, has an explicit review
        rather than an assumption of continued safety.
      tasks:
        - id:             t7-2-1
          name:           "Re-audit path-safety, shell, and git-ops tool boundaries against the current codebase"
          status:         planned
          token_estimate: medium
          notes: >
            These were built and tested in Phase 1. Confirm no regression
            introduced by later phases (pipeline engine, sub-agent runner,
            Foundry client) that could bypass project-root path safety.

        - id:             t7-2-2
          name:           "Confirm no API keys, backend URLs, or config secrets are ever logged, printed in error messages, or written to narrative.md/handoff.md"
          status:         planned
          token_estimate: medium

        - id:             t7-2-3
          name:           "Review install.sh for supply-chain risk: checksum verification is enforced, not optional, before any downloaded binary is executed"
          status:         planned
          token_estimate: medium

        - id:             t7-2-4
          name:           "Confirm ~/.loom/config.yaml is written with restrictive file permissions if it may contain an API key"
          status:         planned
          token_estimate: small

    # ── M7-3 — Official release publish ─────────────────────────────────────
    - id:     m7-3
      name:   "Publish the official v1 GitHub Release"
      status: planned
      agent:  developer
      depends_on: [m7-1, m7-2]
      exit_criterion: >
        RELEASE.md's documented procedure has been followed exactly, end
        to end, for a real, immutable, tagged release — not a test/staging
        run.
      tasks:
        - id:             t7-3-1
          name:           "Follow RELEASE.md steps 1-6 for the real version tag decided in t7-1-1"
          status:         planned
          token_estimate: medium
          depends_on:     [m7-1, m7-2]

        - id:             t7-3-2
          name:           "Follow RELEASE.md step 7 (published installer path verification) from a machine with no repository access"
          status:         planned
          token_estimate: medium
          depends_on:     [t7-3-1]
          notes: >
            This is the real-world equivalent of m6-6's dry run, now
            against the actual published release instead of local
            artifacts. Do not skip on the assumption that m6-6 already
            proved this — m6-6 tested local/staging artifacts, not the
            live GitHub Release URL.

        - id:             t7-3-3
          name:           "Complete RELEASE.md step 8 post-release checks"
          status:         planned
          token_estimate: small
          depends_on:     [t7-3-2]

    # ── M7-4 — Support and feedback intake ──────────────────────────────────
    - id:     m7-4
      name:   "Real user feedback loop"
      status: planned
      agent:  architect
      depends_on: [m7-3]
      exit_criterion: >
        There is a defined place for a real user to report a problem and
        a defined process for triaging what comes in — this cannot be the
        first time that question gets answered.
      tasks:
        - id:             t7-4-1
          name:           "Add GitHub issue templates (bug report, feature request)"
          status:         planned
          token_estimate: small

        - id:             t7-4-2
          name:           "Write CONTRIBUTING.md if external contributions are in scope; otherwise explicitly document that they are not yet"
          status:         planned
          token_estimate: small

        - id:             t7-4-3
          name:           "Recruit at least one real external tester (not the operator) to run USER_TESTING.md independently"
          status:         planned
          token_estimate: medium
          notes: >
            Every dry run so far has been performed by the operator, who
            has deep context the guide assumes away but a real stranger
            won't have. This is the first genuinely blind test.

        - id:             t7-4-4
          name:           "Triage and address findings from t7-4-3 before considering v1 stable"
          status:         planned
          token_estimate: large
          depends_on:     [t7-4-3]

# ─────────────────────────────────────────────────────────────────────────────
# Deliberately out of scope for Phase 7 (fast-follow candidates, not blockers):
#
#   - Public Foundry server / marketplace launch — the Foundry client exists
#     but the hosted registry, package publishing flow, and community agent
#     ecosystem are a separate initiative from "LOOM v1 CLI is released."
#   - Homebrew / package manager distribution beyond install.sh.
#   - CI/CD automation of the release procedure (RELEASE.md is intentionally
#     manual for v1, per t6-4-3).
#   - Telemetry or crash reporting — no decision has been made on this, and
#     none should ship without an explicit opt-in design and privacy review.
#
# These are candidates for a Phase 8 once v1 is live and real usage exists
# to prioritize against. Do not pull them into Phase 7 to avoid scope creep
# on the actual release gate.
# ─────────────────────────────────────────────────────────────────────────────
